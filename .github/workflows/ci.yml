name: Release checks

on:
    workflow_call:
        inputs:
            ref:
                description: Git ref to verify
                required: false
                type: string
            release-tag:
                description: Release tag that must match the package version
                required: false
                type: string
            upload-artifact:
                description: Upload the verified package for a downstream publish job
                required: false
                default: false
                type: boolean
    pull_request:
        branches: [main]
    push:
        branches: [main]
    merge_group:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    LEFTHOOK: 0
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    audit:
        name: Audit & release readiness
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Dependency audit
              run: bun audit

            - name: Verify release tag matches package version
              if: inputs.release-tag != ''
              env:
                  RELEASE_TAG: ${{ inputs.release-tag }}
              run: |
                  node --input-type=module <<'NODE'
                  import packageJson from './packages/sivir/package.json' with { type: 'json' };

                  const expectedTag = `v${packageJson.version}`;

                  if (process.env.RELEASE_TAG !== expectedTag) {
                      console.error(`Release tag must be ${expectedTag}`);
                      process.exit(1);
                  }
                  NODE

    format:
        name: Format check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Format check
              run: bun run format:check

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Lint
              run: bun run lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Typecheck
              run: bun run check

    test-unit:
        name: Test (unit + ssr)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Test (unit + ssr)
              run: bun --filter='docs' run test:ci

    test-registry:
        name: Test (registry)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Build sivir package
              # apps/registry imports @sivir-ui/svelte's built output (e.g. dist/svelte/themes/*),
              # which the mega job used to get for free from an earlier turbo-driven step.
              run: ./node_modules/.bin/turbo run build --filter='@sivir-ui/svelte'

            - name: Test (registry)
              run: bun --filter='registry' run test

    test-sivir:
        name: Test (sivir package)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Test (sivir package)
              run: bun --filter='@sivir-ui/svelte' run test

    test-browser:
        name: Test (browser)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Install Playwright Chromium
              # Keep the browser binary aligned with the Playwright version pinned in
              # bun.lock; resolving a different CLI version can install the wrong build.
              run: |
                  PW_VERSION=$(basename "$(ls -d node_modules/.bun/playwright@* | head -1)" | cut -d'@' -f2)
                  echo "Installing Playwright $PW_VERSION browsers"
                  bunx "playwright@${PW_VERSION}" install --with-deps chromium

            - name: Test (browser)
              run: bun --filter='docs' run test:browser

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Build
              run: bun run build

            - name: Build standalone docs deployment
              run: DOCS_ADAPTER=node bun --filter='docs' run build

            - name: Verify standalone docs handler has no runtime dependencies
              run: |
                  runtime_dir=$(mktemp -d)
                  cp -R apps/docs/build "$runtime_dir/build"
                  cp package.json "$runtime_dir/package.json"
                  cd "$runtime_dir"
                  node -e "import('./build/handler.js')"

    verify-release-artifact:
        name: Verify release artifact
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace

            - name: Test CLI in a fresh consumer
              run: bun --filter='@sivir-ui/svelte' run sandbox

            - name: Verify packed package in a fresh SvelteKit consumer
              run: bun --filter='@sivir-ui/svelte' run verify:artifact

            - name: Verify CLI source-copy from retained tarball
              run: bun --filter='@sivir-ui/svelte' run verify:cli-artifact

            - name: Test installer lab
              run: bun --cwd apps/installer-lab test

            - name: Upload verified package
              if: inputs.upload-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sivir-package
                  path: packages/sivir/.release/*.tgz
                  if-no-files-found: error
                  include-hidden-files: true
                  retention-days: 1
