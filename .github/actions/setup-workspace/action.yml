name: Setup workspace
description: Install toolchains, restore caches, and install workspace dependencies

runs:
    using: composite
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: 1.3.11

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
              node-version: 22

        - name: Cache Bun install
          uses: actions/cache@v4
          with:
              path: ~/.bun/install/cache
              key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-bun-

        - name: Cache Turbo
          uses: actions/cache@v4
          with:
              path: .turbo
              key: ${{ runner.os }}-turbo-${{ github.sha }}
              restore-keys: |
                  ${{ runner.os }}-turbo-

        - name: Install dependencies
          shell: bash
          run: bun install --frozen-lockfile
